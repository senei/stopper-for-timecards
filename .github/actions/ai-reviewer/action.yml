# Composite action: run the team's code review agent (reviewer/) on a pull request diff.
# Used by .github/workflows/review.yml as a local action (uses: ./.github/actions/ai-reviewer).
# Untrusted PR text goes through env, never interpolated into a script.
name: AI Reviewer
description: Run the team's code review agent on a pull request diff

inputs:
  api-key:
    description: OpenRouter API key
    required: true
  model:
    description: OpenRouter model id passed to the reviewer
    required: false
    default: z-ai/glm-5.3
  pr-title:
    description: Pull request title
    required: false
    default: ""
  pr-body:
    description: Pull request description (optional; the reviewer cuts it to a fixed length)
    required: false
    default: ""
  diff-file:
    description: Path to a file with the PR diff (a file avoids output size and newline limits)
    required: true
  max-diff-chars:
    description: Do not call the model when the diff has more characters than this
    required: false
    default: "200000"

outputs:
  status:
    description: "reviewed, or too-large when the diff is above the limit and the model was not called"
    value: ${{ steps.agent.outputs.status }}
  verdict:
    description: Binding pass or fail verdict (empty when the diff was too large)
    value: ${{ steps.agent.outputs.verdict }}
  review-file:
    description: Path to the full JSON review (empty when the diff was too large)
    value: ${{ steps.agent.outputs.review-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Install reviewer dependencies
      shell: bash
      run: npm ci --prefix "$GITHUB_WORKSPACE/reviewer"

    - name: Run agent
      id: agent
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.api-key }}
        REVIEWER_MODEL: ${{ inputs.model }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        MAX_DIFF_CHARS: ${{ inputs.max-diff-chars }}
        DIFF_FILE: ${{ inputs.diff-file }}
      run: |
        review_file="$RUNNER_TEMP/ai-review.json"
        set +e
        (cd "$GITHUB_WORKSPACE/reviewer" && npx --no-install tsx src/index.ts < "$DIFF_FILE" > "$review_file")
        code=$?
        set -e

        # Exit code 3 is the reviewer's "diff too large" signal; the model was not called.
        if [ "$code" -eq 3 ]; then
          echo "status=too-large" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$code" -ne 0 ]; then
          echo "::error::reviewer exited with code $code"
          exit "$code"
        fi

        verdict=$(node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!["pass", "fail"].includes(r.verdict)) process.exit(1); console.log(r.verdict)' "$review_file")
        echo "status=reviewed" >> "$GITHUB_OUTPUT"
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "review-file=$review_file" >> "$GITHUB_OUTPUT"
