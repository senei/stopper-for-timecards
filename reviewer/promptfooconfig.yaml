# Evaluate the real reviewer (createReviewer/reviewDiff) on three OpenRouter models against one fixture diff.
# Run: npm run eval --prefix reviewer   (needs OPENROUTER_API_KEY in reviewer/.env; spends credits)
# promptfoo needs Node 22.22+ and runs through npx, pinned in package.json.
# `file://` paths resolve from this file's directory. The provider ignores the prompt text and reads vars.diff,
# because the reviewer builds its own prompt from SYSTEM_PROMPT and buildUserPrompt.
description: Code review agent - one diff, three models

providers:
  - id: file://src/evals/provider.ts
    label: glm-5.3
    config:
      model: z-ai/glm-5.3
  - id: file://src/evals/provider.ts
    label: deepseek-v4.1-flash
    config:
      model: deepseek/deepseek-v4.1-flash
  - id: file://src/evals/provider.ts
    label: gpt-5.6-luna
    config:
      model: openai/gpt-5.6-luna

# promptfoo requires a prompt, but the provider ignores it and reads the diff from vars.diffFile.
prompts:
  - "Review the pull request diff given in the test variables."

defaultTest:
  options:
    # llm-rubric judge, set explicitly: the default grader is chosen from credentials in the environment
    # and an OpenRouter key is not among the documented ones.
    provider: openrouter:anthropic/claude-sonnet-5.5

tests:
  - description: React 16 -> 19 migration with three planted flaws
    vars:
      # A plain path, read by the provider. Do not use file:// here: promptfoo renders variable values through its
      # template engine and the fixture contains `{{`, which fails to parse.
      diffFile: evals/fixtures/react19-migration.diff
    assert:
      # 1. the reviewer returns JSON (the CI gate depends on it)
      - type: is-json
      # 2. a second model checks that the review names what is broken
      - type: llm-rubric
        value: >-
          The review identifies all three planted flaws and explains why each one breaks the component:
          (1) ReactDOM.render in src/index.jsx, which was removed in React 19 so the app cannot mount (createRoot is required);
          (2) the effect in OrderSummary subscribes to orderStore and never unsubscribes, a leak that the class version
          avoided in componentWillUnmount;
          (3) order.note is rendered through dangerouslySetInnerHTML, which allows script injection from user-supplied text.
      # 3. hard condition on the binding verdict
      - type: javascript
        value: JSON.parse(output).verdict === "fail"
